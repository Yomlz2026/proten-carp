
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بروتين وكارب</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>

<body>

<div class="loginScreen" id="mainLogin">
    <div class="loginBox">
        <h1>🥗 بروتين وكارب</h1>
        <input type="password" id="sitePassword" placeholder="كلمة مرور النظام">
        <button onclick="loginSite()">دخول النظام</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <h2>☁️ الإشراف السحابي</h2>
        <button onclick="openAdminLogin()">⚙️ الإشراف</button>
    </div>

    <div class="card" id="adminPanel" style="display:none;">
        <h3>لوحة الإشراف</h3>

        <input type="file" id="pdfFile" accept=".pdf">
        <button onclick="processPDF()">📄 رفع وتحليل PDF</button>

        <input type="text" id="newSiteCode" placeholder="تغيير رمز الصفحة الرئيسية">
        <input type="text" id="newAdminCode" placeholder="تغيير رمز لوحة الإشراف">
        <button onclick="saveCodes()">💾 حفظ الرموز</button>

        <button class="closeBtn" onclick="closeAdminPanel()">إغلاق الإشراف</button>
    </div>

    <div class="card">
        <h3>📋 قائمة المشتركين</h3>
        <div id="mealCardsContainer"></div>
    </div>
</div>

<div id="adminModal" class="adminModal">
    <div class="adminBox">
        <h3>🔐 دخول الإشراف</h3>
        <input type="password" id="adminPassword" placeholder="كلمة مرور الإشراف">
        <button onclick="checkAdminPassword()">دخول</button>
        <button class="closeBtn" onclick="closeAdminLogin()">إغلاق</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
