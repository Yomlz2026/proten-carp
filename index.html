<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Kufi Arabic', sans-serif; }
body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 15px; padding-bottom: 100px; overflow-x: hidden; position: relative; }

/* شاشة الترحيب الاحترافية المخصصة للجوال (أهلاً يوملز) مع دخول ناعم */
#splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
.splash-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.08); padding: 30px 40px; border-radius: 24px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); animation: splashFadeIn 0.5s ease; max-width: 85%; }
@keyframes splashFadeIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.splash-text { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 0.5px; }
.splash-text .brand-carb { color: #facc15; }

/* النافذة المنبثقة الاحترافية الفخمة لاتخاذ الإجراء الفوري */
#customAlertModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 20000; display: none; justify-content: center; align-items: center; padding: 20px; }
.alert-card { background: #1e293b; border-radius: 24px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); animation: alertScaleUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); border: 1px solid rgba(255, 255, 255, 0.08); }
@keyframes alertScaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.alert-status-icon { font-size: 45px; margin-bottom: 12px; display: inline-block; }
.alert-title-text { font-size: 18px; font-weight: 700; color: #facc15; margin-bottom: 8px; }
.alert-message-text { font-size: 15px; color: #cbd5e1; line-height: 1.6; margin-bottom: 20px; }

/* أزرار الإجراءات الفخمة */
.modal-actions-group { display: flex; gap: 10px; margin-bottom: 12px; }
.modal-btn { flex: 1; padding: 14px; border-radius: 14px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; transition: all 0.2s; }
.modal-btn-deliver { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
.modal-btn-deliver:active { background: rgba(34, 197, 94, 0.35); }
.modal-btn-cancel { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
.modal-btn-cancel:active { background: rgba(239, 68, 68, 0.25); }
.modal-btn-close { background: rgba(255, 255, 255, 0.06); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; }

/* لوحة المشرف المحمية */
#adminAuthModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px; }
.auth-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 30px; width: 100%; max-width: 380px; text-align: center; }
.auth-input { width: 100%; padding: 12px; border-radius: 12px; background: rgba(15,23,42,0.6); color: white; border: 1px solid rgba(255,255,255,0.1); text-align: center; font-size: 20px; font-weight: bold; letter-spacing: 3px; outline: none; margin-bottom: 15px; }

/* واجهة السجلات الجانبية المحدثة مع الفوتر الإحصائي */
.reports-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 5000; display: none; flex-direction: column; }
.reports-overlay.open { display: flex; }
.reports-header { display: flex; align-items: center; justify-content: space-between; padding: 20px; background: #1e293b; border-bottom: 1px solid rgba(255,255,255,0.05); }
.reports-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.05); }
.reports-tab { flex: 1; padding: 14px; text-align: center; font-size: 14px; font-weight: 700; border: none; cursor: pointer; color: #94a3b8; background: transparent; }
.reports-tab.active-tab { color: #22c55e; border-bottom: 2px solid #22c55e; }
.reports-tab.cancel-tab.active-tab { color: #ef4444; border-bottom-color: #ef4444; }
.reports-content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; }
.report-card { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }

/* فوتر إحصائي ثابت أسفل السلايدر الجانبي */
.reports-footer-stats { position: absolute; bottom: 0; left: 0; width: 100%; background: #1e293b; border-top: 1px solid rgba(255,255,255,0.08); padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; box-shadow: 0 -10px 25px rgba(0,0,0,0.3); z-index: 5001; }
.report-stat-box { padding: 10px; border-radius: 10px; text-align: center; font-size: 12px; font-weight: bold; }

/* البانر والتنسيق العام للموقع */
.top-banner { width: 100%; height: 110px; background-size: cover; background-position: center; border-radius: 16px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.08); }
.container { width: 100%; max-width: 650px; margin: auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(30,41,59,0.45); padding: 12px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.brand-title { font-size: 20px; font-weight: 700; }
.brand-protein { color: #22c55e; } .brand-carb { color: #facc15; }

/* الكروت الزجاجية */
.card { background: rgba(30, 41, 59, 0.45); border: 1px solid rgba(255, 255, 255, 0.06); padding: 20px; border-radius: 20px; margin-bottom: 15px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
.control-panel { background: rgba(20, 83, 45, 0.25); border: 1px solid rgba(34, 197, 94, 0.2); display: none; }

input { width: 100%; padding: 14px; border-radius: 14px; background: rgba(15, 23, 42, 0.5); color: white; border: 1px solid rgba(255, 255, 255, 0.08); outline: none; font-size: 15px; font-weight: 700; }
input[type="number"] { font-size: 20px; text-align: center; letter-spacing: 1px; }

.searchBtn { background: rgba(255, 255, 255, 0.06); color: white; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; width: 100%; margin-top: 12px; border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: background 0.2s; }
.searchBtn:active { background: rgba(255, 255, 255, 0.12); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { padding: 12px; border-radius: 14px; text-align: center; font-weight: 700; font-size: 14px; border: 1px solid rgba(255,255,255,0.04); }
.greenBox { background: rgba(34, 197, 94, 0.12); color: #22c55e; border-color: rgba(34, 197, 94, 0.2); } 
.red { background: rgba(239, 68, 68, 0.12); color: #ef4444; border-color: rgba(239, 68, 68, 0.18); }

/* قائمة الفرز السفلية */
.meal-row-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 16px; margin-top: 10px; display: flex; flex-direction: column; gap: 12px; animation: slideIn 0.2s ease-out; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
.meal-card-main-info { display: flex; justify-content: space-between; align-items: center; }
.meal-card-info { display: flex; flex-direction: column; gap: 2px; }
.meal-card-num { color: #facc15; font-weight: 700; font-size: 15px; }
.meal-card-name { font-size: 14px; color: #e2e8f0; font-weight: 700; }

.card-actions-area { display: flex; gap: 8px; border-top: 1px dashed rgba(255,255,255,0.06); padding-top: 10px; }
.card-row-btn { flex: 1; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: bold; border: none; cursor: pointer; transition: all 0.2s; }

/* تعديل موقع زر الواتساب: بالجهة اليمنى وفي منتصف الشاشة عمودياً تماماً لمنع ضياعه */
.whatsapp-float { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); width: 52px; height: 52px; background: #25d366; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 9999; transition: all 0.2s; }
.whatsapp-float:active { transform: translateY(-50%) scale(0.9); }

/* شريط مأمون محمد النقي */
.ticker-wrap { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; padding: 10px 0; z-index: 999; overflow: hidden; border-top: 1px solid rgba(255, 255, 255, 0.06); }
.ticker-text { display: inline-block; white-space: nowrap; padding-left: 100%; animation: tickerMove 14s linear infinite; font-size: 13px; font-weight: 700; color: #cbd5e1; }
@keyframes tickerMove { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
</style>
</head>

<div class="container">

    <div class="header">

        <input id="whatsappInput" type="tel" value="966506546313" placeholder="رقم الواتساب..." style="margin-bottom:10px;"/>

        <button class="uploadBtn" onclick="saveAdminSettings()" style="margin-bottom:5px;">💾 حفظ الإعدادات السحابية</button>
        <button onclick="document.getElementById('adminPanel').style.display='none'" class="modal-btn modal-btn-cancel" style="width:100%; padding:8px;">إغلاق اللوحة</button>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playBeep(type) {
    try {
        initAudio(); if (!audioCtx) return;
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'success') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        } else {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.setValueAtTime(165, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    } catch(e) { console.log(e); }
}

window.addEventListener('click', () => { initAudio(); }, { once: true });
window.addEventListener('touchstart', () => { initAudio(); }, { once: true });

const defaultBanner = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=1000";
const firebaseConfig = {
  apiKey: "AIzaSyBY_5FtbLuUgLiOebfmzAMKqnDsvsbeDXc",
  authDomain: "protencarp.firebaseapp.com",
  projectId: "protencarp",
  storageBucket: "protencarp.firebasestorage.app",
  messagingSenderId: "37899247050",
  appId: "1:37899247050:web:e8464a6386510174e2c333",
  databaseURL: "https://protencarp-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

var meals = [], tableStatus = {}, searchedNumbers = new Set(), activeTab = "done", waNum = "966506546313", currentBannerUrl = defaultBanner;

window.addEventListener('load', () => {
    setTimeout(() => { 
        let s = document.getElementById("splashScreen");
        if(s) { s.style.opacity = "0"; setTimeout(() => s.style.display="none", 600); }
    }, 1500);
});

function showCustomAlert(icon, title, message, isSuccess = true, showActions = false, num = null) {
    document.getElementById("alertIcon").innerHTML = icon;
    document.getElementById("alertTitle").innerHTML = title;
    document.getElementById("alertMessage").innerHTML = message;
    
    let actionsBox = document.getElementById("modalActionButtons");
    if(showActions && num) {
        actionsBox.style.display = "flex";
        document.getElementById("modalConfirmBtn").onclick = function() { actionMeal(num, 'done'); closeCustomAlert(); };
        document.getElementById("modalCancelBtn").onclick = function() { actionMeal(num, 'cancel'); closeCustomAlert(); };
    } else {
        actionsBox.style.display = "none";
    }
    
    playBeep(isSuccess ? 'success' : 'error');
    document.getElementById("customAlertModal").style.display = "flex";
}

function closeCustomAlert() { document.getElementById("customAlertModal").style.display = "none"; }

db.ref("pnc_data").on("value", (snapshot) => {
    let data = snapshot.val() || {};
    meals = data.mealsList || [];
    tableStatus = data.actions || {};
    waNum = data.whatsapp || "966506546313";
    currentBannerUrl = data.bannerUrl || defaultBanner;
    
    document.getElementById("waLink").href = "https://wa.me/" + waNum;
    document.getElementById("whatsappInput").value = waNum;
    document.getElementById("bannerUrlInput").value = currentBannerUrl === defaultBanner ? "" : currentBannerUrl;
    document.getElementById("topBanner").style.backgroundImage = `linear-gradient(rgba(15,23,42,0.3), rgba(15,23,42,0.9)), url('${currentBannerUrl}')`;
    
    searchedNumbers.clear();
    Object.keys(tableStatus).forEach(num => searchedNumbers.add(num));
    
    document.getElementById("status").innerHTML = meals.length > 0 ? "🟢 متصل بالسيرفر الفوري: " + meals.length : "🟢 متصل: بانتظار الـ PDF.";
    recalculateStats(); renderCards(); updateReports();
});

function openAdmin() { document.getElementById("adminPasswordInput").value = ""; document.getElementById("adminAuthModal").style.display = "flex"; document.getElementById("adminPasswordInput").focus(); }
function closeAdminModal() { document.getElementById("adminAuthModal").style.display = "none"; }
function verifyAdminCode() {
    if(document.getElementById("adminPasswordInput").value.trim() === "71138") {
        playBeep('success'); document.getElementById("adminAuthModal").style.display = "none"; document.getElementById("adminPanel").style.display = "block";
    } else {
        playBeep('error'); alert("الرمز غير صحيح!");
    }
}

function saveAdminSettings() {
    db.ref("pnc_data/whatsapp").set(document.getElementById("whatsappInput").value.trim());
    db.ref("pnc_data/bannerUrl").set(document.getElementById("bannerUrlInput").value.trim() || defaultBanner);
    showCustomAlert("✨", "تم التحديث", "تم حفظ الإعدادات ومزامنتها بنجاح!", true);
}

async function startReadingPDF(file) {
    if(!file) return;
    document.getElementById("status").innerHTML = "⏳ فرز الـ PDF...";
    meals = []; searchedNumbers.clear();
    let reader = new FileReader();
    reader.onload = async function() {
        try {
            let typedarray = new Uint8Array(this.result), pdf = await pdfjsLib.getDocument(typedarray).promise;
            for (let p = 1; p <= pdf.numPages; p++) {
                let page = await pdf.getPage(p), content = await page.getTextContent(), lastY = "", lines = [], currentLine = "";
                for (let item of content.items) {
                    if (lastY !== "" && item.transform[5] !== lastY) { lines.push(currentLine); currentLine = ""; }
                    currentLine += " " + item.str; lastY = item.transform[5];
                }
                lines.push(currentLine);
                lines.forEach(line => {
                    let numMatch = line.match(/\b\d{5,8}\b/);
                    if (numMatch) {
                        let num = numMatch[0], nameClean = line.replace(num, "").replace(/[:\-\*]/g, "").trim().replace(/\s+/g, " ");
                        if (nameClean.length < 3) nameClean = "مشترك رقم (" + num + ")";
                        meals.push({ number: num, name: nameClean });
                    }
                });
            }
            meals = meals.filter((v, i, a) => a.findIndex(t => t.number === v.number) === i);
            db.ref("pnc_data/mealsList").set(meals); db.ref("pnc_data/actions").set({});
            showCustomAlert("✅", "نجاح الفرز", "تم تحميل الكشف اليومي بنجاح: " + meals.length + " مشترك", true);
        } catch(e) {
            showCustomAlert("❌", "خطأ بالملف", "فشل قراءة ملف الـ PDF الكشف غير مطابق.", false);
        }
    };
    reader.readAsArrayBuffer(file);
}

function checkMeal() {
    let input = document.getElementById("mealInput"), num = input.value.trim();
    if (!num) return;
    if (meals.length === 0) { showCustomAlert("⚠️", "تنبيه", "الرجاء رفع ملف الـ PDF الخاص بالمشتركين أولاً.", false); return; }
    
    let meal = meals.find(m => m.number == num);
    if (!meal) { showCustomAlert("❌", "غير موجود", `رقم الاشتراك [ ${num} ] غير مدرج في كشف اليوم!`, false); input.value = ""; return; }
    
    if(tableStatus[num]) {
        let saved = tableStatus[num];
        if(saved.status === "done") {
            showCustomAlert("✅", "مستلم مسبقاً", `المشترك: <b>(${meal.name})</b><br>استلم الوجبة اليوم الساعة: ${saved.time}`, false);
            input.value = ""; return;
        } else if(saved.status === "cancel") {
            showCustomAlert("🛑", "اشتراك ملغى", `انتبه! المشترك: <b>(${meal.name})</b><br>طلب إلغاء اليوم منذ الساعة: ${saved.time}`, false);
            input.value = ""; return;
        }
    }
    
    showCustomAlert("👤", "تأكيد حالة الفرز", `اسم المشترك: <b>${meal.name}</b><br>رقم الاشتراك الحالي: # ${num}<br><br>الرجاء اختيار الإجراء المطلوب للعميل:`, true, true, num);
    input.value = "";
}

function actionMeal(num, type) {
    let now = new Date(), timeString = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', hour12: true });
    searchedNumbers.delete(num); searchedNumbers.add(num);
    db.ref("pnc_data/actions/" + num).set({ status: type, time: timeString });
}

function recalculateStats() {
    let d = 0, c = 0;
    Object.keys(tableStatus).forEach(k => {
        if(tableStatus[k].status === "done") d++; if(tableStatus[k].status === "cancel") c++;
    });
    document.getElementById("doneMeals").innerHTML = d; document.getElementById("cancelMeals").innerHTML = c;
    
    let overlayDone = document.getElementById("overlayDoneCount");
    let overlayCancel = document.getElementById("overlayCancelCount");
    if(overlayDone) overlayDone.innerHTML = d;
    if(overlayCancel) overlayCancel.innerHTML = c;
}

function renderCards() {
    let container = document.getElementById("mealCardsContainer"), numbers = Array.from(searchedNumbers);
    if (numbers.length === 0) { container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:15px; font-size:13px;">لا توجد عمليات فرز حالياً.</p>'; return; }
    let html = "";
    
    numbers.reverse().forEach(num => {
        let meal = meals.find(m => m.number == num), name = meal ? meal.name : "مشترك #" + num, item = tableStatus[num] || {};
        let st = item.status || "pending", tm = item.time || "--:--";
        let txt = "⏳ معلق", col = "#facc15";
        if(st === "done") { txt = "✅ مستلم"; col = "#22c55e"; }
        if(st === "cancel") { txt = "❌ ملغى"; col = "#ef4444"; }
        
        html += `<div class="meal-row-card">
            <div class="meal-card-main-info">
                <div class="meal-card-info">
                    <span class="meal-card-num"># ${num}</span>
                    <span class="meal-card-name">${name}</span>
                </div>
                <div style="text-align:left;">
                    <span style="color:${col}; font-weight:700; font-size:13px;">${txt}</span><br>
                    <small style="color:#94a3b8; font-size:11px;">${tm}</small>
                </div>
            </div>
            ${st === "pending" ? `
            <div class="card-actions-area">
                <button class="card-row-btn modal-btn-deliver" onclick="actionMeal('${num}', 'done')">✅ تسليم سريع</button>
                <button class="card-row-btn modal-btn-cancel" onclick="actionMeal('${num}', 'cancel')">❌ إلغاء</button>
            </div>
            ` : ''}
        </div>`;
    });
    container.innerHTML = html;
}

function openReports() { updateReports(); document.getElementById("reportsOverlay").classList.add("open"); }
function closeReports() { document.getElementById("reportsOverlay").classList.remove("open"); }
function switchTab(t) { activeTab = t; document.getElementById("tab-done").classList.toggle("active-tab", t==="done"); document.getElementById("tab-cancel").classList.toggle("active-tab", t==="cancel"); updateReports(); }

function updateReports() {
    let content = document.getElementById("reportsContent"), html = "", keys = Object.keys(tableStatus).filter(k => tableStatus[k].status === activeTab);
    if(keys.length === 0) { content.innerHTML = `<div style="text-align:center; color:#64748b; padding:40px;">السجل فارغ.</div>`; return; }
    keys.forEach(num => {
        let meal = meals.find(m => m.number == num), name = meal ? meal.name : "مشترك #" + num;
        html += `<div class="report-card"><div><b># ${num}</b><br><small style="color:#cbd5e1">${name}</small></div><div style="text-align:left"><span style="color:${activeTab==='done'?'#22c55e':'#ef4444'}">${activeTab==='done'?'✓ مستلم':'✕ ملغى'}</span><br><small style="color:#94a3b8">${tableStatus[num].time}</small></div></div>`;
    });
    content.innerHTML = html;
}
</script>
</body>
</html>
