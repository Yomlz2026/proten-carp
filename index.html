<style>

.card{background:rgba(30,41,59,.55);padding:16px;border-radius:20px;margin-bottom:14px;border:1px solid rgba(255,255,255,.08)}
.admin{display:none;background:rgba(20,83,45,.25)}
.admin label {font-size:12px; color:#94a3b8; display:block; margin-bottom:6px; margin-top:8px; font-weight:bold; text-align:right;}
.title{font-size:14px;font-weight:900;margin-bottom:12px}
.row{display:flex;gap:8px}
.row button{flex:1;padding:12px;border-radius:14px;background:#1e293b;color:#94a3b8;font-weight:900}

.yellow{background:rgba(250,204,21,.12);color:#facc15}

.meal{background:#111827;padding:15px;border-radius:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06);cursor:pointer}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
.num{color:#22c55e;font-weight:900}

.status{font-size:12px;text-align:center;color:#facc15;font-weight:900;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.modal-box{background:#111827;border-radius:28px;padding:25px;width:100%;max-width:400px;text-align:center}
.modal-box h3{margin:10px 0}

.delivery{background:rgba(59,130,246,.12);color:#38bdf8}

.archive{background:rgba(255,255,255,.05);padding:12px;border-radius:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}

<script>
const firebaseConfig={
apiKey:"AIzaSyBY_5FtbLuUgLiOebfmzAMKqnDsvsbeDXc",
authDomain:"protencarp.firebaseapp.com",
databaseURL:"https://protencarp-default-rtdb.firebaseio.com/",
projectId:"protencarp",
storageBucket:"protencarp.appspot.com",
messagingSenderId:"37899247050",
appId:"1:37899247050:web:e8464a6386510174e2c333"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let meals=[],actions={},archives={};
let currentBranch="delivery";

function login(){
const p=document.getElementById("pass").value.trim();
if(p!=="1234"&&p!=="0000"){alertBox("❌","خطأ","رمز غير صحيح");return;}
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
connect();
}

function connect(){
db.ref("pnc_data").on("value",s=>{
const d=s.val()||{};
meals=d.mealsList||[];
actions=d.actions||{};
archives=d.archives||{};

if(d.banner) {
    document.getElementById("banner").style.backgroundImage="url('"+d.banner+"')";
}
if(d.logo) {
    document.getElementById("loginLogoImg").src = d.logo;
    document.getElementById("loginLogoImg").style.display = "block";
    document.getElementById("loginLogoEmoji").style.display = "none";
}

render();
renderArchives();
drawerStats();
document.getElementById("state").innerHTML="🟢 متصل";
});
}

// 🧠 دالة رفع الصور كملفات للسحابة
function saveImages() {
    const bFile = document.getElementById("bannerFile").files[0];
    const lFile = document.getElementById("logoFile").files[0];
    const st = document.getElementById("imgStatus");
    
    if(!bFile && !lFile) {
        st.innerHTML = "⚠️ لم تقم باختيار أي صورة!";
        return;
    }
    
    st.innerHTML = "⏳ جاري الرفع للسحابة...";
    let updates = {};
    let promises = [];

    if (bFile) {
        promises.push(new Promise((resolve) => {
            let r = new FileReader();
            r.onload = (e) => { updates['pnc_data/banner'] = e.target.result; resolve(); };
            r.readAsDataURL(bFile);
        }));
    }
    if (lFile) {
        promises.push(new Promise((resolve) => {
            let r = new FileReader();
            r.onload = (e) => { updates['pnc_data/logo'] = e.target.result; resolve(); };
            r.readAsDataURL(lFile);
        }));
    }

    Promise.all(promises).then(() => {
        if (Object.keys(updates).length > 0) {
            db.ref().update(updates).then(() => {
                st.innerHTML = "✅ تم حفظ الصور وتعميمها بنجاح";
                document.getElementById("bannerFile").value = "";
                document.getElementById("logoFile").value = "";
                setTimeout(() => { st.innerHTML = ""; }, 4000);
            });
        }
    });
}

function switchBranch(b){
document.getElementById("search").value = "";
currentBranch=b;
["Delivery","Batarji","Ruhaily"].forEach(x=>document.getElementById("b"+x).classList.remove("active"));
document.getElementById("b"+b.charAt(0).toUpperCase()+b.slice(1)).classList.add("active");
document.getElementById("deliverAll").style.display=b==="delivery"?"block":"none";
render();
}

function render(){
const q=document.getElementById("search").value.toLowerCase().trim();
const list=document.getElementById("list");
list.innerHTML="";
let p=0,d=0,c=0;

meals.filter(m=>m.branch===currentBranch).forEach(m=>{
const st=(actions[m.number]||{}).status||"pending";
if(st==="done")d++;
else if(st==="cancel")c++;
else p++;
});

let displayedMeals = meals;

if(q) {
    displayedMeals = meals.filter(m => String(m.name).toLowerCase().includes(q) || String(m.number).includes(q));
    if(displayedMeals.length === 0) {
        list.innerHTML = "<div style='text-align:center; padding:20px; color:#ef4444; font-weight:bold; line-height:1.8;'>❌ غير موجود!<br>تأكد من رقم المشترك أو اسمه.</div>";
    }
} else {
    displayedMeals = meals.filter(m => m.branch === currentBranch);
}

displayedMeals.forEach(m=>{
const st=(actions[m.number]||{}).status||"pending";
let badge="<span style='color:#facc15'>⏳ انتظار</span>";
if(st==="done")badge="<span style='color:#22c55e'>✅ مستلم</span>";
if(st==="cancel")badge="<span style='color:#ef4444'>❌ ملغى</span>";

let branchBadge = "";
if(q) {
    if(m.branch === "batarji") branchBadge = " <span style='font-size:11px; background:#22c55e; color:#fff; padding:3px 6px; border-radius:6px; margin-right:5px;'>🏪 البترجي</span>";
    else if(m.branch === "ruhaily") branchBadge = " <span style='font-size:11px; background:#c084fc; color:#fff; padding:3px 6px; border-radius:6px; margin-right:5px;'>🏪 الرحيلي</span>";
    else branchBadge = " <span style='font-size:11px; background:#38bdf8; color:#fff; padding:3px 6px; border-radius:6px; margin-right:5px;'>🚚 التوصيل</span>";
}

let displayName = m.name || ("مشترك " + m.number);

const div=document.createElement("div");
div.className="meal";
div.innerHTML="<div class='top'><div class='num'>#"+m.number+branchBadge+"</div>"+badge+"</div><div class='name'>"+displayName+"</div>";
div.onclick=()=>mealAction(m);
list.appendChild(div);
});

document.getElementById("pending").innerHTML=p;
document.getElementById("done").innerHTML=d;
document.getElementById("cancel").innerHTML=c;
}

function searchMeal(){
    const q=document.getElementById("search").value.toLowerCase().trim();
    if(!q) return;
    
    const found = meals.filter(m => String(m.name).toLowerCase().includes(q) || String(m.number).includes(q));
    
    if(found.length === 0) {
        alertBox("❌", "غير موجود", "المشترك غير مسجل في كشف اليوم!");
    } else if(found.length === 1) {
        mealAction(found[0]);
        render();
    } else {
        render();
    }
}

function mealAction(m){
const st=(actions[m.number]||{}).status||"pending";

let bName = m.branch === "batarji" ? "🏪 البترجي" : (m.branch === "ruhaily" ? "🏪 الرحيلي" : "🚚 التوصيل");
let bColor = m.branch === "batarji" ? "#22c55e" : (m.branch === "ruhaily" ? "#c084fc" : "#38bdf8");
let displayName = m.name || ("مشترك " + m.number);

let infoHtml = "<b>" + displayName + "</b><br>" +
               "<span style='color:#facc15'>#" + m.number + "</span><br><br>" +
               "<span style='color:" + bColor + "; font-size:15px; font-weight:900; background:rgba(255,255,255,0.05); padding:6px 12px; border-radius:10px;'>القسم: " + bName + "</span>";

if(st==="done"){
    alertBox("✅","تم التسليم مسبقاً", infoHtml);
    return;
}

alertBox("👤","تأكيد الإجراء", infoHtml);
document.getElementById("actions").style.display="flex";

document.getElementById("ok").onclick=()=>{
db.ref("pnc_data/actions/"+m.number).set({
status:"done",
time:new Date().toLocaleTimeString("ar-SA")
});
closeModal();
};

document.getElementById("no").onclick=()=>{
db.ref("pnc_data/actions/"+m.number).set({
status:"cancel",
time:new Date().toLocaleTimeString("ar-SA")
});
closeModal();
};
}

// 🚀 دالة قراءة PDF
function startReadingPDF() {
    const file = document.getElementById("pdf").files[0];
    if (!file) { alertBox("⚠️","تنبيه","اختر PDF"); return; }
    
    document.getElementById("pdfStatus").innerHTML = "⏳ جاري قراءة الكشف بدقة...";

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    var reader = new FileReader();
    reader.onload = function () {
        var typedarray = new Uint8Array(this.result);
        pdfjsLib.getDocument(typedarray).promise.then(function (pdf) {
            var countPromises = [];
            for (var j = 1; j <= pdf.numPages; j++) {
                countPromises.push(
                    pdf.getPage(j).then(function (page) {
                        return page.getTextContent().then(function (textContent) {
                            return textContent.items.map(function (item) {
                                return item.str;
                            }).join(" [SPLIT] ");
                        });
                    })
                );
            }
            Promise.all(countPromises).then(function (pageTexts) {
                var fullCombinedText = pageTexts.join(" [SPLIT] ");
                parseAndProcessPDFText(fullCombinedText);
            }).catch(function (ex) {
                alertBox("❌", "خطأ", "خطأ أثناء معالجة نصوص PDF: " + ex.message);
            });
        }).catch(function (err) {
            alertBox("❌", "خطأ", "حدث خطأ أثناء تحليل PDF: " + err.message);
        });
    };
    reader.readAsArrayBuffer(file);
}

// 🎯 الخوارزمية الذهبية الجديدة: فرز وقنص الأسماء بشكل صافي ونقي 100%
function parseAndProcessPDFText(text) {
    var newMeals = [];
    
    // تنظيف الحشو العام لتجنب التشويش
    text = text.replace(/\[SPLIT\]/g, " ");
    text = text.replace(/Page\s+\d+\s+of\s+\d+/gi, " ");
    text = text.replace(/---\s*PAGE\s+\d+\s*---/gi, " ");
    text = text.replace(/\d{4}-\d{2}-\d{2}/g, " "); 
    text = text.replace(/\d{10,}/g, " "); 
    
    // تقسيم النص بناءً على (Plan name) لأنه موجود عند كل مشترك
    var chunks = text.split(/Plan\s+name/i);
    
    for (var i = 0; i < chunks.length - 1; i++) {
        // نأخذ الجزء الموجود بعد شعار المطعم مباشرة، لأن هذا الجزء يحتوي فقط على الرقم والاسم!
        var pieces = chunks[i].split(/PROTEIN\s+AND\s+CARB/i);
        var headerText = pieces[pieces.length - 1]; 
        
        // للحماية: إذا كان النص طويل جداً نأخذ آخره فقط
        if (headerText.length > 200) {
            headerText = headerText.slice(-200);
        }
        
        // استخراج رقم المشترك من الأقواس
        var idMatch = headerText.match(/\[(\d{4,8})\]/);
        if (!idMatch) continue;
        
        var num = idMatch[1];
        
        // تنظيف الاسم باقتطاع الرقم، ليبقى الاسم صافي 100%
        var name = headerText.replace(/\[\d{4,8}\]/, " ").trim();
        name = name.replace(/\s+/g, " "); 
        name = name.replace(/^[^\w\u0600-\u06FF]+/, "").replace(/[^\w\u0600-\u06FF]+$/, "").trim();
        
        if (name.length < 2) name = "مشترك رقم " + num;
        
        // تحديد الفرع بالبحث في المقطع التابع للمشترك
        var branchText = chunks[i+1].substring(0, 500).toLowerCase();
        var branch = "delivery";
        if (branchText.includes("بترجي") || branchText.includes("batarji") || branchText.includes("albatarji")) {
            branch = "batarji";
        } else if (branchText.includes("رحيلي") || branchText.includes("ruhaily") || branchText.includes("rhili") || branchText.includes("al-rhili")) {
            branch = "ruhaily";
        }
        
        var alreadyExists = newMeals.some(function (m) { return m.number === num; });
        if (!alreadyExists) {
            newMeals.push({ number: num, name: name, branch: branch });
        }
    }

    if (newMeals.length === 0) {
        alertBox("⚠️", "تنبيه", "لم يتم استخراج أي اشتراكات! تأكد من جودة الكشف.");
        document.getElementById("pdfStatus").innerHTML = "❌ فشل استخراج البيانات";
        return;
    }

    var now = new Date();
    var archiveKey = "Arch_" + now.getTime();

    db.ref("pnc_data/archives/" + archiveKey).set({
        date: now.toLocaleDateString('ar-SA'),
        actions: actions || {},
        meals: meals || []
    }).then(function () {
        return db.ref("pnc_data/actions").remove();
    }).then(function () {
        return db.ref("pnc_data/mealsList").set(newMeals);
    }).then(function () {
        document.getElementById("pdfStatus").innerHTML = "✅ مكتمل (" + newMeals.length + ")";
        alertBox("✅", "تم التحديث بنجاح", "تم استخراج " + newMeals.length + " مشترك بأسماء صافية ومفرزة.");
        document.getElementById('pdf').value = "";
    }).catch(function (err) {
        alertBox("❌", "خطأ", "خطأ أثناء الرفع للسحابة: " + err.message);
    });
}

function drawerStats(){
let d1=0,p1=0;
let d2=0,p2=0;
let d3=0,p3=0;

meals.forEach(m=>{
const st=(actions[m.number]||{}).status||"pending";

if(m.branch==="delivery"){
if(st==="done")d1++;
else if(st!=="cancel")p1++;
}

if(m.branch==="batarji"){
if(st==="done")d2++;
else if(st!=="cancel")p2++;
}

if(m.branch==="ruhaily"){
if(st==="done")d3++;
else if(st!=="cancel")p3++;
}
});

document.getElementById("d1").innerHTML="🚚 التوصيل<br>"+d1+" مستلم / "+p1+" باقي";
document.getElementById("d2").innerHTML="🏪 البترجي<br>"+d2+" مستلم / "+p2+" باقي";
document.getElementById("d3").innerHTML="🏪 الرحيلي<br>"+d3+" مستلم / "+p3+" باقي";
}

function renderArchives(){
const a=document.getElementById("archives");
a.innerHTML="";

Object.keys(archives).reverse().forEach(k=>{
const x=archives[k];
const div=document.createElement("div");
div.className="archive";
div.innerHTML="<div>📅 "+x.date+"</div><button onclick=\"delArchive('"+k+"')\">حذف</button>";
a.appendChild(div);
});
}

function delArchive(k){
if(confirm("هل أنت متأكد من حذف هذا الأرشيف؟")) {
    db.ref("pnc_data/archives/"+k).remove();
}
}

function toggleAdmin(){
document.getElementById("admin").style.display="block";
}

function closeAdmin(){
document.getElementById("admin").style.display="none";
}

function drawer(v){
document.getElementById("drawer").className=v?"drawer open":"drawer";
document.getElementById("overlay").className=v?"drawer-overlay open":"drawer-overlay";
}

function deliverAll(){
if(!confirm("هل أنت متأكد من تحويل جميع طلبات التوصيل إلى 'مستلم'؟")) return;

meals.forEach(m=>{
if(m.branch==="delivery"){
db.ref("pnc_data/actions/"+m.number).set({
status:"done",
time:new Date().toLocaleTimeString("ar-SA")
});
}
});
}

function generateReport(){
alertBox("📄","التقرير","ميزة التقرير جاهزة لاحقاً");
}

function alertBox(i,t,m){
document.getElementById("icon").innerHTML=i;
document.getElementById("title").innerHTML=t;
document.getElementById("msg").innerHTML=m;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
document.getElementById("actions").style.display="none";
}
</script>
