function render(){

function groupPdfItemsIntoLines(items) {
    const rows = [];

    items.forEach(item => {
        const text = String(item.str || "").trim();
        if (!text) return;

        const y = Math.round(item.transform ? item.transform[5] : 0);
        const x = item.transform ? item.transform[4] : 0;

        let row = rows.find(r => Math.abs(r.y - y) <= 3);

        if (!row) {
            row = { y: y, items: [] };
            rows.push(row);
        }

        row.items.push({ x: x, text: text });
    });

    rows.sort((a, b) => b.y - a.y);

    return rows.map(row => {
        const original = row.items.map(i => i.text).join(" ");
        const byX = row.items
            .slice()
            .sort((a, b) => a.x - b.x)
            .map(i => i.text)
            .join(" ");

        return (/\[\d{4,8}\]/.test(original) ? original : byX)
            .replace(/\s+/g, " ")
            .trim();
    });
}
async function startReadingPDF(file) {
    if (!file || !db) return;

    if (!confirm("رفع PDF جديد سيؤرشف اليوم الحالي ويصفر الحالات. هل أنت متأكد؟")) {
        document.getElementById('pdfFile').value = "";
        return;
    }

    document.getElementById("status").innerHTML = "⏳ جاري قراءة ملف PDF...";

    if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    var reader = new FileReader();

    reader.onload = function () {
        var typedarray = new Uint8Array(this.result);

        pdfjsLib.getDocument(typedarray).promise.then(function (pdf) {
            var countPromises = [];

            for (var j = 1; j <= pdf.numPages; j++) {
                countPromises.push(
                    pdf.getPage(j).then(function (page) {
                        return page.getTextContent().then(function (textContent) {
                            return textContent.items.map(function (item) {
                                return item.str;
                            }).join(" [SPLIT] ");
                        });
                    })
                );
            }

            Promise.all(countPromises).then(function (pageTexts) {
                var fullCombinedText = pageTexts.join(" [SPLIT] ");
                parseAndProcessPDFText(fullCombinedText);
            }).catch(function (ex) {
                document.getElementById("status").innerHTML = "❌ خطأ أثناء معالجة PDF";
                alert("خطأ أثناء معالجة نصوص PDF: " + ex.message);
            });

        }).catch(function (err) {
            document.getElementById("status").innerHTML = "❌ خطأ تحليل PDF";
            alert("حدث خطأ أثناء تحليل PDF: " + err.message);
        });
    };

    reader.readAsArrayBuffer(file);
}

function parseAndProcessPDFText(text) {
    var newMeals = [];
    var tokens = text.split(" [SPLIT] ");
    var cleanedTokens = [];

    for (var i = 0; i < tokens.length; i++) {
        var t = String(tokens[i]).trim();
        if (t && t !== "[SPLIT]") cleanedTokens.push(t);
    }

    for (var i = 0; i < cleanedTokens.length; i++) {
        var token = cleanedTokens[i];

        var numMatch = token.match(/\[?(\d{4,8})\]?/);
        if (!numMatch) continue;

        var num = String(numMatch[1]);
        var nameParts = [];
        var branch = "delivery";
        var contextText = "";

        var checkLimit = Math.min(i + 12, cleanedTokens.length);

        for (var nextIdx = i + 1; nextIdx < checkLimit; nextIdx++) {
            var nextToken = cleanedTokens[nextIdx];

            if (/\[?\d{4,8}\]?/.test(nextToken)) break;

            contextText += " " + nextToken;

            if (
                nextToken.length > 1 &&
                nextToken.indexOf(":") === -1 &&
                nextToken.indexOf("/") === -1 &&
                nextToken !== "-" &&
                nextToken !== "*"
            ) {
                nameParts.push(nextToken);
            }
        }

        var fullName = nameParts.join(" ")
            .replace(/\s+/g, " ")
            .trim();

        fullName = fullName
            .replace(/pickup branch/ig, "")
            .replace(/plan name/ig, "")
            .replace(/service type/ig, "")
            .replace(/captain name/ig, "")
            .replace(/district/ig, "")
            .replace(/notes/ig, "")
            .replace(/items count/ig, "")
            .replace(/\[SPLIT\]/ig, "")
            .replace(/\d{4,8}/g, "")
            .trim();

        if (fullName.length > 2) {
            var lowerContext = (contextText + " " + fullName)
                .toLowerCase()
                .replace(/[\u200B-\u200D\uFEFF]/g, "")
                .replace(/[•●·.،,_\-–—:؛]/g, " ")
                .replace(/\s+/g, " ");

            if (
                lowerContext.indexOf("بترجي") !== -1 ||
                lowerContext.indexOf("البترجي") !== -1 ||
                lowerContext.indexOf("batarji") !== -1
            ) {
                branch = "batarji";
            } else if (
                lowerContext.indexOf("رحيلي") !== -1 ||
                lowerContext.indexOf("الرحيلي") !== -1 ||
                lowerContext.indexOf("ruhaily") !== -1 ||
                lowerContext.indexOf("rhili") !== -1
            ) {
                branch = "ruhaily";
            }

            var alreadyExists = newMeals.some(function (m) {
                return m.number === num;
            });

            if (!alreadyExists) {
                newMeals.push({
                    number: num,
                    name: fullName,
                    branch: branch
                });
            }
        }
    }

    if (newMeals.length === 0) {
        alert("⚠️ لم يتم استخراج أي اشتراكات من ملف PDF");
        document.getElementById("status").innerHTML = "❌ فشل استخراج البيانات";
        document.getElementById('pdfFile').value = "";
        return;
    }

    var now = new Date();
    var archiveKey = "Arch_" + now.getTime();

    var totalDone = 0;
    for (var k in tableStatus) {
        if (tableStatus[k] && tableStatus[k].status === "done") totalDone++;
    }

    db.ref("pnc_data/archive/" + archiveKey).set({
        date: now.toLocaleDateString('ar-SA'),
        totalDone: totalDone,
        actions: tableStatus,
        meals: meals,
        totalMeals: meals.length
    }).then(function () {
        return db.ref("pnc_data/actions").set({});
    }).then(function () {
        return db.ref("pnc_data/mealsList").set(newMeals);
    }).then(function () {
        document.getElementById("status").innerHTML =
            "✅ تم تحميل " + newMeals.length + " مشترك بنجاح";

        document.getElementById('pdfFile').value = "";
        document.getElementById("adminPanel").style.display = "none";

        showCustomAlert(
            "✅",
            "تم تحديث الكشف",
            "تم استخراج " + newMeals.length + " مشترك بنجاح",
            true,
            false,
            null
        );

    }).catch(function (err) {
        document.getElementById("status").innerHTML = "❌ خطأ أثناء الرفع";
        alert("خطأ أثناء الرفع للسحابة: " + err.message);
    });
                         }
function cleanPdfName(name) {
    return String(name || "")
        .replace(/\[\d{4,8}\]/g, "")
        .replace(/PROTEIN\s+AND\s+CARB/gi, "")
        .replace(/\bPlan\s+name\b.*$/i, "")
        .replace(/\bItems\s+Count\b.*$/i, "")
        .replace(/\bNotes\b.*$/i, "")
        .replace(/\bDistrict\b.*$/i, "")
        .replace(/\bCaptain\s+Name\b.*$/i, "")
        .replace(/\bService\s+Type\b.*$/i, "")
        .replace(/\bPickup\s+Branch\b.*$/i, "")
        .replace(/\bPage\s+\d+\s+of\s+\d+\b/gi, "")
        .replace(/^\d{8,20}\s*/, "")
        .replace(/^\d{4}-\d{2}-\d{2}\s*/, "")
        .replace(/\s+/g, " ")
        .trim();
}

function normalizePdfText(text) {
    return String(text || "")
        .toLowerCase()
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .replace(/[•●·.،,_\-–—:؛]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function detectPdfBranch(text) {
    const lower = normalizePdfText(text);

    if (
        lower.includes("pickup branch") &&
        (
            lower.includes("batarji") ||
            lower.includes("albatarji") ||
            lower.includes("al batarji") ||
            lower.includes("بترجي") ||
            lower.includes("البترجي")
        )
    ) {
        return "batarji";
    }

    if (
        lower.includes("pickup branch") &&
        (
            lower.includes("rhili") ||
            lower.includes("al rhili") ||
            lower.includes("alrhili") ||
            lower.includes("ruhaily") ||
            lower.includes("alruhaily") ||
            lower.includes("al ruhaily") ||
            lower.includes("رحيلي") ||
            lower.includes("الرحيلي")
        )
    ) {
        return "ruhaily";
    }

    return "delivery";
}
async function readPDF(){
const file=document.getElementById("pdf").files[0];
if(!file){alertBox("⚠️","تنبيه","اختر PDF");return;}

const st=document.getElementById("pdfStatus");
st.innerHTML="⏳ جاري القراءة...";

try{

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const pdf=await pdfjsLib.getDocument({
data:await file.arrayBuffer()
}).promise;

let result=[];
let seen={};
let expected=0;

for(let i=1;i<=pdf.numPages;i++){

st.innerHTML="⏳ صفحة "+i+" / "+pdf.numPages;

const page=await pdf.getPage(i);

const txt=await page.getTextContent();

const text=txt.items.map(x=>x.str).join(" ");

const p=text.match(/Page\s+\d+\s+of\s+(\d+)/i);

if(p)expected=parseInt(p[1]);

const m=extract(text);

if(m&&!seen[m.number]){
seen[m.number]=1;
result.push(m);
}
}

await db.ref("pnc_data/archives/Arch_"+Date.now()).set({
date:new Date().toLocaleDateString("ar-SA"),
actions,
meals
});

await db.ref("pnc_data/actions").remove();
await db.ref("pnc_data/mealsList").set(result);

alertBox("✅","تم","تم استخراج "+result.length+" من "+expected);

st.innerHTML="✅ مكتمل";

}catch(e){
alertBox("❌","خطأ",e.message);
st.innerHTML="❌ فشل";
}
}

function extract(text){

text=String(text).replace(/\s+/g," ");

let m=text.match(/PROTEIN\s+AND\s+CARB\s+(.+?)\s+Plan\s+name/i);

let line=m?m[1]:"";

if(!line){
m=text.match(/(.{0,100}\[\d{4,8}\].{0,100})/);
line=m?m[1]:"";
}

let number=null;
let name="";

let a=line.match(/\[(\d{4,8})\]\s*(.+)$/);

if(a){
number=parseInt(a[1]);
name=a[2];
}

if(!name){
a=line.match(/^(.+?)\s*\[(\d{4,8})\]/);

if(a){
name=a[1];
number=parseInt(a[2]);
}
}

name=String(name)
.replace(/Plan name.*/i,"")
.replace(/Items Count.*/i,"")
.replace(/Page \d+ of \d+/i,"")
.replace(/\s+/g," ")
.trim();

if(!number||name.length<2)return null;

return{
number,
name,
branch:branchDetect(text)
};
}

function branchDetect(t){

t=t.toLowerCase();

if(
t.includes("بترجي")||
t.includes("batarji")
)return"batarji";

if(
t.includes("رحيلي")||
t.includes("ruhaily")||
t.includes("rhili")
)return"ruhaily";

return"delivery";
}

function drawerStats(){

let d1=0,p1=0;
let d2=0,p2=0;
let d3=0,p3=0;

meals.forEach(m=>{
const st=(actions[m.number]||{}).status||"pending";

if(m.branch==="delivery"){
if(st==="done")d1++;
else if(st!=="cancel")p1++;
}

if(m.branch==="batarji"){
if(st==="done")d2++;
else if(st!=="cancel")p2++;
}

if(m.branch==="ruhaily"){
if(st==="done")d3++;
else if(st!=="cancel")p3++;
}
});

document.getElementById("d1").innerHTML="🚚 التوصيل<br>"+d1+" مستلم / "+p1+" باقي";
document.getElementById("d2").innerHTML="🏪 البترجي<br>"+d2+" مستلم / "+p2+" باقي";
document.getElementById("d3").innerHTML="🏪 الرحيلي<br>"+d3+" مستلم / "+p3+" باقي";
}

function renderArchives(){

a.innerHTML="";

Object.keys(archives).reverse().forEach(k=>{

const div=document.createElement("div");
div.className="archive";
div.innerHTML="<div>📅 "+x.date+"</div><button onclick=\"delArchive('"+k+"')\">حذف</button>";
a.appendChild(div);
});
}

function delArchive(k){
db.ref("pnc_data/archives/"+k).remove();
}
