<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>بروتين وكارب</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Kufi Arabic',sans-serif}
body{background:#0f172a;color:#fff;min-height:100vh;padding:15px;padding-bottom:100px}
button{border:none;cursor:pointer;font-family:inherit}
input{width:100%;padding:14px;border-radius:14px;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.08);margin-bottom:10px;font-weight:700}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#020617,#0f172a,#1e1b4b);display:flex;align-items:center;justify-content:center;z-index:99999}
.login-box{background:rgba(30,41,59,.9);padding:28px;border-radius:28px;width:92%;max-width:390px;text-align:center;border:1px solid rgba(255,255,255,.1)}
.login-box h1{margin:10px 0}
.login-box button,.green-btn{width:100%;padding:14px;border-radius:14px;background:#22c55e;color:#fff;font-weight:900}
.app{display:none;max-width:700px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;background:rgba(30,41,59,.6);padding:13px;border-radius:18px;margin-bottom:15px}
.header button{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-size:20px}
.brand{font-size:20px;font-weight:900}
.banner{height:120px;border-radius:20px;background:linear-gradient(135deg,#1e293b,#111827);margin-bottom:15px;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.08)}
.card{background:rgba(30,41,59,.55);padding:16px;border-radius:20px;margin-bottom:14px;border:1px solid rgba(255,255,255,.08)}
.admin{display:none;background:rgba(20,83,45,.25)}
.title{font-size:14px;font-weight:900;margin-bottom:12px}
.row{display:flex;gap:8px}
.row button{flex:1;padding:12px;border-radius:14px;background:#1e293b;color:#94a3b8;font-weight:900}
.row button.active{background:#22c55e;color:#fff}
.search-btn,.purple-btn,.blue-btn,.deliver-btn{width:100%;padding:14px;border-radius:14px;color:#fff;font-weight:900;margin-top:6px}
.search-btn,.purple-btn{background:#7c3aed}
.blue-btn,.deliver-btn{background:#2563eb}
.deliver-btn{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:14px;text-align:center;font-size:13px;font-weight:900}
.yellow{background:rgba(250,204,21,.12);color:#facc15}
.green{background:rgba(34,197,94,.12);color:#22c55e}
.red{background:rgba(239,68,68,.12);color:#ef4444}
.meal{background:#111827;padding:15px;border-radius:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06);cursor:pointer}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
.num{color:#22c55e;font-weight:900}
.name{font-size:15px;font-weight:900;line-height:1.8}
.status{font-size:12px;text-align:center;color:#facc15;font-weight:900;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.modal-box{background:#111827;border-radius:28px;padding:25px;width:100%;max-width:400px;text-align:center}
.modal-box h3{margin:10px 0}
.msg{background:#0f172a;padding:14px;border-radius:14px;line-height:1.9;margin:12px 0}
.actions{display:flex;gap:10px}
.actions button{flex:1;padding:14px;border-radius:14px;color:#fff;font-weight:900}
.ok{background:#22c55e}.no{background:#ef4444}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:4000}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:-330px;width:320px;height:100%;background:#1e293b;z-index:4001;transition:.3s;padding:18px;overflow:auto}
.drawer.open{right:0}
.drawer-card{background:rgba(15,23,42,.5);padding:14px;border-radius:18px;margin-bottom:12px}
.branch-card{padding:14px;border-radius:18px;margin-bottom:10px;font-weight:900}
.delivery{background:rgba(59,130,246,.12);color:#38bdf8}
.batarji{background:rgba(34,197,94,.12);color:#22c55e}
.ruhaily{background:rgba(168,85,247,.12);color:#c084fc}
.archive{background:rgba(255,255,255,.05);padding:12px;border-radius:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.archive button{background:rgba(239,68,68,.15);color:#ef4444;padding:8px 12px;border-radius:10px}
.bottom{position:fixed;bottom:0;left:0;width:100%;background:#111827;padding:10px;text-align:center;border-top:1px solid rgba(255,255,254,.08)}
.bottom a{color:#22c55e;text-decoration:none;font-weight:900}
</style>
</head>

<body>

<div id="login" class="login">
<div class="login-box">
<div style="font-size:55px">🥗</div>
<h1>بروتين وكارب</h1>
<input id="pass" type="password" placeholder="رمز الدخول">
<button onclick="login()">دخول</button>
</div>
</div>

<div id="overlay" class="drawer-overlay" onclick="drawer(false)"></div>

<div id="drawer" class="drawer">
<div class="drawer-card">
<h3>☁️ لوحة المتابعة</h3>
</div>

<div id="d1" class="branch-card delivery"></div>
<div id="d2" class="branch-card batarji"></div>
<div id="d3" class="branch-card ruhaily"></div>

<div class="drawer-card">
<button class="purple-btn" onclick="generateReport()">📄 تحميل تقرير</button>
</div>

<div class="drawer-card">
<h3>📂 الأرشيف</h3>
<div id="archives"></div>
</div>
</div>

<div id="modal" class="modal">
<div class="modal-box">
<div id="icon" style="font-size:45px">⚠️</div>
<h3 id="title">تنبيه</h3>
<div id="msg" class="msg"></div>
<div id="actions" class="actions">
<button id="ok" class="ok">تأكيد</button>
<button id="no" class="no">إلغاء</button>
</div>
<button class="blue-btn" onclick="closeModal()">إغلاق</button>
</div>
</div>

<div id="app" class="app">

<div id="banner" class="banner"></div>

<div class="header">
<button onclick="drawer(true)">☰</button>
<div class="brand">بروتين وكارب</div>
<button onclick="toggleAdmin()">⚙️</button>
</div>

<div id="admin" class="card admin">
<div class="title">⚙️ الإشراف</div>

<input id="pdf" type="file" accept="application/pdf">
<button class="purple-btn" onclick="readPDF()">🚀 قراءة PDF</button>
<div id="pdfStatus" class="status"></div>

<input id="bannerInput" placeholder="رابط صورة البانر">
<button class="blue-btn" onclick="saveBanner()">💾 حفظ البانر</button>

<button class="green-btn" onclick="closeAdmin()">إغلاق</button>
</div>

<div class="row">
<button id="bDelivery" class="active" onclick="switchBranch('delivery')">🚚 التوصيل</button>
<button id="bBatarji" onclick="switchBranch('batarji')">🏪 البترجي</button>
<button id="bRuhaily" onclick="switchBranch('ruhaily')">🏪 الرحيلي</button>
</div>

<div class="card">
<input id="search" placeholder="🔍 الاسم أو الرقم" oninput="render()">
<button class="search-btn" onclick="searchMeal()">بحث</button>
<button id="deliverAll" class="deliver-btn" onclick="deliverAll()">⚡ تسليم الكل</button>
<div id="state" class="status">⏳ جاري الاتصال...</div>
</div>

<div class="card">
<div class="stats">
<div class="stat yellow">انتظار<br><span id="pending">0</span></div>
<div class="stat green">مستلم<br><span id="done">0</span></div>
<div class="stat red">ملغى<br><span id="cancel">0</span></div>
</div>
</div>

<div class="card">
<div id="list"></div>
</div>

</div>

<div class="bottom">
<a href="#">تصميم وتطوير مأمون محمد</a>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyBY_5FtbLuUgLiOebfmzAMKqnDsvsbeDXc",
authDomain:"protencarp.firebaseapp.com",
databaseURL:"https://protencarp-default-rtdb.firebaseio.com/",
projectId:"protencarp",
storageBucket:"protencarp.appspot.com",
messagingSenderId:"37899247050",
appId:"1:37899247050:web:e8464a6386510174e2c333"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let meals=[],actions={},archives={};
let currentBranch="delivery";

function login(){
const p=document.getElementById("pass").value.trim();
if(p!=="1234"&&p!=="0000"){alertBox("❌","خطأ","رمز غير صحيح");return;}
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
connect();
}

function connect(){
db.ref("pnc_data").on("value",s=>{
const d=s.val()||{};
meals=d.mealsList||[];
actions=d.actions||{};
archives=d.archives||{};
document.getElementById("banner").style.backgroundImage="url('"+(d.banner||"")+"')";
render();
renderArchives();
drawerStats();
document.getElementById("state").innerHTML="🟢 متصل";
});
}

function switchBranch(b){
currentBranch=b;
["Delivery","Batarji","Ruhaily"].forEach(x=>document.getElementById("b"+x).classList.remove("active"));
document.getElementById("b"+b.charAt(0).toUpperCase()+b.slice(1)).classList.add("active");
document.getElementById("deliverAll").style.display=b==="delivery"?"block":"none";
render();
}

function render(){
const q=document.getElementById("search").value.toLowerCase();
const list=document.getElementById("list");
list.innerHTML="";
let p=0,d=0,c=0;

meals.filter(m=>m.branch===currentBranch).forEach(m=>{
const st=(actions[m.number]||{}).status||"pending";

if(st==="done")d++;
else if(st==="cancel")c++;
else p++;

if(q&&!String(m.name).toLowerCase().includes(q)&&!String(m.number).includes(q))return;

let badge="<span style='color:#facc15'>⏳ انتظار</span>";
if(st==="done")badge="<span style='color:#22c55e'>✅ مستلم</span>";
if(st==="cancel")badge="<span style='color:#ef4444'>❌ ملغى</span>";

const div=document.createElement("div");
div.className="meal";
div.innerHTML="<div class='top'><div class='num'>#"+m.number+"</div>"+badge+"</div><div class='name'>"+m.name+"</div>";
div.onclick=()=>mealAction(m);
list.appendChild(div);
});

document.getElementById("pending").innerHTML=p;
document.getElementById("done").innerHTML=d;
document.getElementById("cancel").innerHTML=c;
}

function mealAction(m){
const st=(actions[m.number]||{}).status||"pending";
if(st==="done"){alertBox("✅","تم التسليم","<b>"+m.name+"</b><br>#"+m.number);return;}

alertBox("👤","تأكيد","<b>"+m.name+"</b><br>#"+m.number);
document.getElementById("actions").style.display="flex";

document.getElementById("ok").onclick=()=>{
db.ref("pnc_data/actions/"+m.number).set({
status:"done",
time:new Date().toLocaleTimeString("ar-SA")
});
closeModal();
};

document.getElementById("no").onclick=()=>{
db.ref("pnc_data/actions/"+m.number).set({
status:"cancel",
time:new Date().toLocaleTimeString("ar-SA")
});
closeModal();
};
}

// 🚀 دالة قراءة وفرز الـ PDF الأصلية والقديمة (اللي صممتها لك وكنت شغال عليها بكفاءة)
async function readPDF(){
const file=document.getElementById("pdf").files[0];
if(!file){alertBox("⚠️","تنبيه","اختر PDF");return;}

const st=document.getElementById("pdfStatus");
st.innerHTML="⏳ جاري القراءة...";

try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const pdf=await pdfjsLib.getDocument({
        data:await file.arrayBuffer()
    }).promise;

    var countPromises = [];
    for (var j = 1; j <= pdf.numPages; j++) {
        countPromises.push(
            pdf.getPage(j).then(function (page) {
                return page.getTextContent().then(function (textContent) {
                    return textContent.items.map(function (item) {
                        return item.str;
                    }).join(" [SPLIT] ");
                });
            })
        );
    }

    const pageTexts = await Promise.all(countPromises);
    var text = pageTexts.join(" [SPLIT] ");
    
    var newMeals = [];
    var tokens = text.split(" [SPLIT] ");
    var cleanedTokens = [];

    for (var i = 0; i < tokens.length; i++) {
        var t = String(tokens[i]).trim();
        if (t && t !== "[SPLIT]") cleanedTokens.push(t);
    }

    for (var i = 0; i < cleanedTokens.length; i++) {
        var token = cleanedTokens[i];
        var numMatch = token.match(/\[?(\d{4,8})\]?/);
        if (!numMatch) continue;

        var num = String(numMatch[1]);
        var nameParts = [];
        var contextText = "";
        var checkLimit = Math.min(i + 12, cleanedTokens.length);

        for (var nextIdx = i + 1; nextIdx < checkLimit; nextIdx++) {
            var nextToken = cleanedTokens[nextIdx];
            if (/\[?\d{4,8}\]?/.test(nextToken)) break;
            contextText += " " + nextToken;

            if (
                nextToken.length > 1 &&
                nextToken.indexOf(":") === -1 &&
                nextToken.indexOf("/") === -1 &&
                nextToken !== "-" &&
                nextToken !== "*"
            ) {
                nameParts.push(nextToken);
            }
        }

        var fullName = nameParts.join(" ").replace(/\s+/g, " ").trim();

        fullName = fullName
            .replace(/pickup branch/ig, "")
            .replace(/plan name/ig, "")
            .replace(/service type/ig, "")
            .replace(/captain name/ig, "")
            .replace(/district/ig, "")
            .replace(/notes/ig, "")
            .replace(/items count/ig, "")
            .replace(/\[SPLIT\]/ig, "")
            .replace(/\d{4,8}/g, "")
            .trim();

        if (fullName.length > 2) {
            var branch = "delivery";
            var lowerContext = (contextText + " " + fullName)
                .toLowerCase()
                .replace(/[\u200B-\u200D\uFEFF]/g, "")
                .replace(/[•●·.،,_\-–—:؛]/g, " ")
                .replace(/\s+/g, " ");

            if (
                lowerContext.indexOf("بترجي") !== -1 ||
                lowerContext.indexOf("البترجي") !== -1 ||
                lowerContext.indexOf("batarji") !== -1
            ) {
                branch = "batarji";
            } else if (
                lowerContext.indexOf("رحيلي") !== -1 ||
                lowerContext.indexOf("الرحيلي") !== -1 ||
                lowerContext.indexOf("ruhaily") !== -1 ||
                lowerContext.indexOf("rhili") !== -1
            ) {
                branch = "ruhaily";
            }

            var alreadyExists = newMeals.some(function (m) {
                return m.number === num;
            });

            if (!alreadyExists) {
                newMeals.push({
                    number: num,
                    name: fullName,
                    branch: branch
                });
            }
        }
    }

    if (newMeals.length === 0) {
        alertBox("⚠️", "تنبيه", "لم يتم استخراج أي اشتراكات من ملف PDF");
        st.innerHTML = "❌ فشل استخراج البيانات";
        return;
    }

    // الأرشفة والمزامنة السحابية المتوافقة تماماً
    await db.ref("pnc_data/archives/Arch_"+Date.now()).set({
        date: new Date().toLocaleDateString("ar-SA"),
        actions: actions || {},
        meals: meals || []
    });

    await db.ref("pnc_data/actions").remove();
    await db.ref("pnc_data/mealsList").set(newMeals);

    alertBox("✅", "تم الحفظ", "تمت القراءة بنجاح واستخراج " + newMeals.length + " مشترك وتوزيعهم للفروع.");
    st.innerHTML = "✅ مكتمل (" + newMeals.length + ")";

}catch(e){
    alertBox("❌","خطأ",e.message);
    st.innerHTML="❌ فشل";
}
}

function drawerStats(){
let d1=0,p1=0;
let d2=0,p2=0;
let d3=0,p3=0;

meals.forEach(m=>{
const st=(actions[m.number]||{}).status||"pending";

if(m.branch==="delivery"){
if(st==="done")d1++;
else if(st!=="cancel")p1++;
}

if(m.branch==="batarji"){
if(st==="done")d2++;
else if(st!=="cancel")p2++;
}

if(m.branch==="ruhaily"){
if(st==="done")d3++;
else if(st!=="cancel")p3++;
}
});

document.getElementById("d1").innerHTML="🚚 التوصيل<br>"+d1+" مستلم / "+p1+" باقي";
document.getElementById("d2").innerHTML="🏪 البترجي<br>"+d2+" مستلم / "+p2+" باقي";
document.getElementById("d3").innerHTML="🏪 الرحيلي<br>"+d3+" مستلم / "+p3+" باقي";
}

function renderArchives(){
const a=document.getElementById("archives");
a.innerHTML="";

Object.keys(archives).reverse().forEach(k=>{
const x=archives[k];
const div=document.createElement("div");
div.className="archive";
div.innerHTML="<div>📅 "+x.date+"</div><button onclick=\"delArchive('"+k+"')\">حذف</button>";
a.appendChild(div);
});
}

function delArchive(k){
db.ref("pnc_data/archives/"+k).remove();
}

function toggleAdmin(){
document.getElementById("admin").style.display="block";
}

function closeAdmin(){
document.getElementById("admin").style.display="none";
}

function drawer(v){
document.getElementById("drawer").className=v?"drawer open":"drawer";
document.getElementById("overlay").className=v?"drawer-overlay open":"drawer-overlay";
}

function saveBanner(){
const v=document.getElementById("bannerInput").value.trim();
db.ref("pnc_data/banner").set(v);
}

function deliverAll(){
meals.forEach(m=>{
if(m.branch==="delivery"){
db.ref("pnc_data/actions/"+m.number).set({
status:"done",
time:new Date().toLocaleTimeString("ar-SA")
});
}
});
}

function generateReport(){
alertBox("📄","التقرير","ميزة التقرير جاهزة لاحقاً");
}

function searchMeal(){render();}

function alertBox(i,t,m){
document.getElementById("icon").innerHTML=i;
document.getElementById("title").innerHTML=t;
document.getElementById("msg").innerHTML=m;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
document.getElementById("actions").style.display="none";
}
</script>

</body>
</html>
